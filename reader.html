<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ القرآن | وِردك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reader.css">
    <style>
        /* تثبيت أزرار الآيات وإظهارها بوضوح تام وتنسيق زر التفسير */
        .ayah-actions {
            display: flex !important;
            gap: 10px !important;
            margin-top: 15px !important;
            opacity: 1 !important;
        }

        .ayah-action {
            width: 38px !important;
            height: 38px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            border-radius: 10px !important;
            background: var(--primary-light) !important;
            color: var(--primary) !important;
            font-size: 15px !important;
            border: 1px solid var(--border) !important;
            cursor: pointer !important;
        }

        .ayah-action:hover {
            background: var(--primary) !important;
            color: #fff !important;
        }

        /* تنسيق نافذة التفسير المعزولة لتظهر بنقاء وبدون تداخل */
        #tafsirModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        #tafsirModal .settings-box {
            background: #ffffff !important;
            color: #222222 !important;
            width: 90%;
            max-width: 550px;
            padding: 25px 30px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid #e0e0e0;
            position: relative;
            text-align: right;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">
                <span class="logo-icon">۞</span>
                <span>وِردك</span>
            </a>
            <div class="header-actions">
                <button class="theme-btn" id="themeBtn" title="الوضع الليلي">🌙</button>
            </div>
        </div>
    </header>

    <main class="reader-page">
        <div class="container">
            <a href="index.html" class="back-link">← العودة إلى وِردك</a>

            <div class="surah-title-box" style="text-align: center; margin-bottom: 30px;">
                <h1 id="surahName">جاري التحميل...</h1>
                <p id="surahEnglish">—</p>
            </div>

            <!-- حاوية الآيات -->
            <div id="ayahContainer" class="quran-page">
                <div style="text-align: center; padding: 40px; color: var(--muted);">جاري تحميل السورة...</div>
            </div>
        </div>
    </main>

    <!-- نافذة التفسير المنبثقة بتنسيق نظيف ومنتصف -->
    <div id="tafsirModal">
        <div class="settings-box">
            <div
                style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 15px;">
                <div>
                    <span id="tafsirAyahNum" style="color: #c5a059; font-weight: bold; font-size: 14px;">الآية --</span>
                    <h2 style="margin: 3px 0 0 0; font-size: 20px; color: #0d6b50;">التفسير الميسر</h2>
                </div>
                <button id="closeTafsir"
                    style="background: #f5f5f5; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; color: #555; display: flex; align-items: center; justify-content: center;">✕</button>
            </div>
            <div id="tafsirBody"
                style="font-family: 'Amiri', serif; font-size: 20px; line-height: 2.2; color: #333333; max-height: 50vh; overflow-y: auto; padding-left: 5px;">
                جاري تحميل التفسير...
            </div>
        </div>
    </div>

    <!-- عنصر الصوت -->
    <audio id="quranAudio" preload="metadata"></audio>

    <!-- الكود البرمجي المدمج لضمان عمل الأيقونات والتفسير مباشرة -->
    <script type="module">
        import { getSurah } from "./api.js";

        const params = new URLSearchParams(window.location.search);
        const surahNum = Number(params.get("surah") || 1);

        document.addEventListener("DOMContentLoaded", async () => {
            // تفعيل الوضع الليلي
            if (localStorage.getItem("wardakTheme") === "dark") {
                document.body.classList.add("dark");
            }
            document.getElementById("themeBtn").onclick = () => {
                document.body.classList.toggle("dark");
                localStorage.setItem("wardakTheme", document.body.classList.contains("dark") ? "dark" : "light");
            };

            // إغلاق نافذة التفسير
            const modal = document.getElementById("tafsirModal");
            const closeBtn = document.getElementById("closeTafsir");
            const closeModal = () => modal.style.display = "none";

            closeBtn.onclick = closeModal;
            modal.onclick = (e) => {
                if (e.target === modal) closeModal();
            };

            try {
                // جلب نص السورة والتفسير الميسر معاً
                const [surahData, tafsirData] = await Promise.all([
                    getSurah(surahNum, "quran-uthmani"),
                    getSurah(surahNum, "ar.muyassar")
                ]);

                document.getElementById("surahName").textContent = surahData.name;
                document.getElementById("surahEnglish").textContent = `${surahData.englishName} • ${surahData.numberOfAyahs} آية`;

                const container = document.getElementById("ayahContainer");
                container.innerHTML = "";

                surahData.ayahs.forEach((ayah, index) => {
                    const article = document.createElement("article");
                    article.className = "quran-ayah";
                    article.style.cssText = "padding: 25px 15px; border-bottom: 1px solid var(--border);";

                    article.innerHTML = `
                        <div class="ayah-text" style="font-family: 'Amiri', serif; font-size: 32px; line-height: 2.3; text-align: right;">
                            <span class="ayah-number" style="display:inline-flex; width:38px; height:38px; align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--gold); background:var(--primary); color:var(--gold-light); font-size:13px; margin-left:12px; vertical-align:middle;">${ayah.numberInSurah}</span>
                            ${ayah.text}
                        </div>
                        <div class="ayah-actions">
                            <button class="ayah-action play-btn" title="تشغيل التلاوة">▶</button>
                            <button class="ayah-action tafsir-btn" title="عرض التفسير الميسر">📖</button>
                            <button class="ayah-action copy-btn" title="نسخ الآية">⧉</button>
                        </div>
                    `;

                    // برمجة زر التشغيل
                    article.querySelector(".play-btn").onclick = () => {
                        const audio = document.getElementById("quranAudio");
                        audio.src = ayah.audio;
                        audio.play();
                    };

                    // برمجة زر التفسير (📖)
                    article.querySelector(".tafsir-btn").onclick = () => {
                        const tText = tafsirData.ayahs[index].text;
                        document.getElementById("tafsirAyahNum").textContent = `الآية ${ayah.numberInSurah}`;
                        document.getElementById("tafsirBody").textContent = tText;
                        modal.style.display = "flex";
                    };

                    // برمجة زر النسخ
                    article.querySelector(".copy-btn").onclick = () => {
                        navigator.clipboard.writeText(`${ayah.text} ﴿${ayah.numberInSurah}﴾`);
                        alert("تم نسخ الآية ✓");
                    };

                    container.appendChild(article);
                });

            } catch (err) {
                document.getElementById("ayahContainer").innerHTML = "<div style='text-align:center; padding:30px; color:red;'>تعذر تحميل السورة. تأكد من اتصال الإنترنت.</div>";
            }
        });
    </script>
</body>

</html>
