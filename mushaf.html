<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف المصور | وِردك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- ربط ملفات التصميم للحصول على الزخارف والألوان -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reader.css">
</head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d6b50">

<body class="reader-page">

    <!-- الهيدر -->
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">
                <span class="logo-icon">۞</span>
                <span>وِردك</span>
            </a>
            <div class="header-actions">
                <a href="index.html" class="back-home">العودة للرئيسية</a>
                <button class="theme-btn" id="mushafThemeBtn" title="الوضع الليلي">☾</button>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 30px;">

        <!-- شريط التحكم بالصفحات -->
        <div class="reader-toolbar" style="max-width: 700px; margin-bottom: 25px;">
            <button id="nextPage" class="reader-btn">الصفحة التالية ←</button>
            <div style="font-weight: 800; color: var(--primary); font-size: 18px;">
                صفحة <span id="pageNumDisplay">1</span>
            </div>
            <button id="prevPage" class="reader-btn">→ الصفحة السابقة</button>
        </div>

        <!-- إطار المصحف المزخرف -->
        <div class="quran-page"
            style="max-width: 700px; padding: 25px; display: flex; justify-content: center; align-items: center;">
            <img id="mushafImage" src="https://quran.ksu.edu.sa/png_big/1.png" alt="صفحة المصحف"
                style="max-width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); transition: 0.3s ease;">
        </div>

    </main>

    <script src="mushaf.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>

</html>
